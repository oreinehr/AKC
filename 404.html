<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Page not found — Alessandro Kuhn Contes</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<link rel="icon" href="assets/akc_logo_white.svg" type="image/svg+xml" />
<link rel="stylesheet" href="colors_and_type.css" />
<style>
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--color-bone);
    color: var(--color-foundation);
    font-family: 'Roboto', system-ui, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 48px 24px;
    box-sizing: border-box;
  }
  .wrap { max-width: 640px; margin: 0 auto; width: 100%; }
  .code {
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: lowercase;
    color: var(--fg-secondary);
    margin-bottom: 24px;
  }
  h1 {
    font-family: 'Migra', Georgia, serif;
    font-weight: 600;
    font-size: clamp(40px, 9vw, 72px);
    line-height: 1.05;
    letter-spacing: -0.02em;
    margin: 0 0 20px;
  }
  p {
    font-size: 17px;
    line-height: 1.6;
    max-width: 46ch;
    margin: 0 0 32px;
    color: var(--color-foundation);
  }
  .links { display: flex; flex-wrap: wrap; gap: 10px 28px; }
  .links a {
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 13px;
    text-transform: lowercase;
    color: var(--color-accent-loud);
    text-decoration: none;
    border-bottom: 1px solid transparent;
    padding-bottom: 2px;
  }
  .links a:hover { border-bottom-color: var(--color-accent-loud); }
  .rule { height: 1px; background: rgba(15,17,21,0.16); margin: 40px 0 20px; }
  .foot {
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 11px;
    letter-spacing: 0.04em;
    color: var(--fg-secondary);
  }
  @media (prefers-color-scheme: dark) {
    body { background: var(--color-foundation); color: var(--color-bone); }
    p, h1 { color: var(--color-bone); }
    .rule { background: rgba(240,235,225,0.18); }
    /* cobalt and the muted greys go dim on the dark ground — lift both */
    .code, .foot { color: rgba(240,235,225,0.55); }
    .links a { color: #6E9BFF; }
    .links a:hover { border-bottom-color: #6E9BFF; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="code">error 404</div>
    <h1>This page doesn't exist.</h1>
    <p>The link may be old, or the address mistyped. Everything lives on the main site.</p>
    <div class="links">
      <a href="/">home</a>
      <a href="/work.html">work</a>
      <a href="/about.html">about</a>
      <a href="/blog.html">writing</a>
      <a href="/contact.html">contact</a>
      <a href="/machine">machine</a>
    </div>
    <div class="rule"></div>
    <div class="foot">alessandro kuhn contes · hello@akcontes.com</div>
  </div>
</body>
</html>
