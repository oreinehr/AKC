<script type="text/babel">
function App() {
  const [data, setData] = useStore();
  const dark    = data.dark !== false;
  const setDark = (v) => setData((s) => ({ ...s, dark: !!v }));
  const lang    = data.lang || "en";
  const setLang = (v) => setData((s) => ({ ...s, lang: v }));
  const { mobile, tablet } = useBreakpoint();
  return <AboutPage data={data} dark={dark} setDark={setDark} lang={lang} setLang={setLang} mobile={mobile} tablet={tablet} />;
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
